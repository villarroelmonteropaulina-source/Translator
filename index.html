<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Doors Multi-Device Station + Egg Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: #121216;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 20px 0;
        }

        .orientation-warning {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #0b0b0e;
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .orientation-warning h2 { color: #ffb347; font-size: 20px; margin-bottom: 10px; }
        .orientation-warning p { color: #a0a0b0; font-size: 14px; }

        @media screen and (max-height: 500px) and (orientation: landscape) {
            .orientation-warning { display: flex; }
        }

        .device-container {
            background-color: #23232c;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7), inset 0 2px 5px rgba(255,255,255,0.1);
            border: 4px solid #1a1a21;
            width: 520px;
            max-width: 95vw;
            position: relative;
        }

        .screen {
            border-radius: 6px;
            height: 320px;
            position: relative;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .screen.translator {
            background: radial-gradient(circle, #3b285a 0%, #1c1130 100%);
            border: 4px solid #7d5ab5;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8), 0 0 15px rgba(125, 90, 181, 0.4);
        }

        .screen.flashlight {
            background: radial-gradient(circle, #234232 0%, #0f241a 100%);
            border: 4px solid #5ab57d;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8), 0 0 15px rgba(90, 181, 125, 0.4);
        }

        .screen.threat {
            background: radial-gradient(circle, #5a3828 0%, #301a11 100%);
            border: 4px solid #b57d5a;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8), 0 0 15px rgba(181, 125, 90, 0.4);
        }

        .screen.egg {
            background: linear-gradient(180deg, #87ceeb 0%, #90ee90 70%, #228b22 100%);
            border: 4px solid #d4af37;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.6), 0 0 15px rgba(212, 175, 55, 0.4);
            padding: 10px;
        }

        .screen.dead-battery {
            background: #2a2d34 !important;
            border: 4px solid #3c4049 !important;
            box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.9) !important;
        }
        .screen.dead-battery::after { display: none !important; }

        .screen::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            z-index: 10;
            pointer-events: none;
        }

        .screen.egg::after { display: none; }

        .screen-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 5;
        }

        .header-right { display: flex; align-items: center; gap: 10px; }

        .battery {
            display: flex;
            border: 2px solid #bba3e8;
            padding: 2px;
            border-radius: 3px;
            width: 45px;
            height: 20px;
            position: relative;
        }
        .battery::after {
            content: '';
            position: absolute;
            right: -5px; top: 5px; width: 3px; height: 6px;
            background-color: inherit;
            border-radius: 0 2px 2px 0;
        }
        .battery-bar {
            background-color: #bba3e8;
            flex: 1;
            margin-right: 2px;
            transition: background-color 0.3s ease, opacity 0.3s ease;
        }
        .battery-bar:last-child { margin-right: 0; }
        .battery-bar.depleted { background-color: transparent; opacity: 0.2; }

        .translator .battery { border-color: #bba3e8; }
        .translator .battery::after, .translator .battery-bar { background-color: #bba3e8; }
        .translator .device-title { color: #e0d4f7; }

        .flashlight .battery { border-color: #a3e8bb; }
        .flashlight .battery::after, .flashlight .battery-bar { background-color: #a3e8bb; }
        .flashlight .device-title { color: #d4f7e0; }

        .threat .battery { border-color: #e8cbb3; }
        .threat .battery::after, .threat .battery-bar { background-color: #e8cbb3; }
        .threat .device-title { color: #f7e2d4; }

        .egg .battery { border-color: #333; }
        .egg .battery::after, .egg .battery-bar { background-color: #333; }
        .egg .device-title { color: #222; text-shadow: none; font-weight: 900; }

        .dead-battery .battery { border-color: #707582; }
        .dead-battery .battery::after, .dead-battery .battery-bar { background-color: #707582; }
        .dead-battery .device-title { color: #8a919e; text-shadow: none; }

        .device-title { font-size: 17px; font-weight: bold; letter-spacing: 1.5px; }

        .settings-btn {
            background: rgba(0,0,0,0.3);
            border: 1px solid currentColor;
            color: inherit;
            padding: 4px 8px;
            font-size: 11px;
            border-radius: 4px;
            cursor: pointer;
        }
        .settings-btn:hover { background: rgba(255,255,255,0.2); }

        .screen-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 5;
        }

        .speech-bubble {
            border: 2px dashed #9b7ac4;
            border-radius: 20px;
            padding: 15px 20px;
            width: 100%;
            text-align: center;
            position: relative;
            background: rgba(45, 30, 75, 0.4);
        }
        .dead-battery .speech-bubble { border-color: #555b66; background: rgba(60, 65, 75, 0.3); }

        .status-text { font-size: 17px; color: #d1bcef; font-weight: bold; text-transform: uppercase; margin-bottom: 5px; }
        .dead-battery .status-text { color: #ff6b6b; }

        .translated-text { font-size: 13px; color: #fff; min-height: 38px; display: flex; align-items: center; justify-content: center; }
        .dead-battery .translated-text { color: #adb3c2; }

        .module-icon-container { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
        .icon-box { border: 2px solid currentColor; border-radius: 50%; width: 90px; height: 90px; display: flex; align-items: center; justify-content: center; font-size: 40px; background: rgba(0,0,0,0.2); }
        .module-subtext { font-size: 14px; letter-spacing: 1px; text-transform: uppercase; font-weight: bold; text-align: center; }

        #eggCanvas {
            background: transparent;
            display: block;
            margin: 0 auto;
            cursor: pointer;
        }

        .module-selector { display: flex; gap: 6px; margin-bottom: 12px; }
        .module-tab {
            flex: 1;
            background-color: #1a1a21;
            border: 2px solid #3c3c4a;
            color: #aaa;
            padding: 6px 2px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }
        .module-tab.active { background-color: #3b285a; border-color: #7d5ab5; color: #fff; }

        .settings-modal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(18, 14, 28, 0.95);
            z-index: 20; display: none; flex-direction: column; justify-content: center; align-items: center; padding: 20px; border-radius: 12px;
        }
        .settings-modal.active { display: flex; }
        .settings-modal h3 { color: #e0d4f7; margin-bottom: 15px; font-size: 16px; }
        .lang-options { display: flex; flex-direction: column; gap: 8px; width: 80%; max-width: 250px; }
        .lang-btn { background-color: #2e1f47; border: 1px solid #7d5ab5; color: #fff; padding: 8px; border-radius: 4px; cursor: pointer; font-size: 13px; }
        .lang-btn.selected, .lang-btn:hover { background-color: #6a43a8; }
        .close-modal { margin-top: 15px; background-color: #4a3278; font-size: 11px; padding: 6px 12px; }

        .control-panel { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
        .control-panel label { font-size: 12px; color: #a0a0b0; text-transform: uppercase; }
        .input-group { display: flex; gap: 8px; }
        input[type="text"] { flex: 1; background-color: #15151a; border: 2px solid #3c3c4a; border-radius: 6px; padding: 10px 14px; color: #fff; font-size: 14px; outline: none; }
        input[type="text"]:disabled { background-color: #1f2228; border-color: #353840; color: #6c7280; }

        button.action-btn { background-color: #6a43a8; color: white; border: none; padding: 10px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 12px; }
        button.action-btn:hover { background-color: #7d5ab5; }
        button.action-btn:disabled { background-color: #3a3f4a; color: #6c7280; }

        .presets-container { display: flex; flex-direction: column; gap: 5px; }
        .presets-title { font-size: 11px; color: #8c8c9e; text-transform: uppercase; }
        .preset-buttons { display: flex; gap: 5px; flex-wrap: wrap; }
        .preset-btn { background-color: #2a2a36; font-size: 11px; padding: 6px 10px; border: 1px solid #444455; color: #fff; border-radius: 4px; cursor: pointer; }
        .preset-btn:hover { background-color: #3b3b4d; }
    </style>
</head>
<body>

    <div class="orientation-warning">
        <h2 id="warningTitle">⚠️ Gira tu dispositivo</h2>
        <p id="warningText">Este dispositivo de Doors solo funciona en formato vertical.</p>
    </div>

    <div class="device-container">
        <div class="module-selector">
            <button class="module-tab active" id="tabTranslator" onclick="switchModule('translator')">Trans.</button>
            <button class="module-tab" id="tabFlashlight" onclick="switchModule('flashlight')">Flash</button>
            <button class="module-tab" id="tabThreat" onclick="switchModule('threat')">Threat</button>
            <button class="module-tab" id="tabEgg" onclick="switchModule('egg')">Egg/Charles</button>
        </div>

        <div class="screen translator" id="mainScreen">
            <div class="settings-modal" id="settingsModal">
                <h3 id="modalTitle">Seleccionar Idioma</h3>
                <div class="lang-options">
                    <button class="lang-btn" onclick="changeLanguage('es')">🇪🇸 Español</button>
                    <button class="lang-btn" onclick="changeLanguage('en')">🇬🇧 English</button>
                    <button class="lang-btn" onclick="changeLanguage('pt')">🇧🇷 Português</button>
                    <button class="lang-btn" onclick="changeLanguage('fr')">🇫🇷 Français</button>
                    <button class="lang-btn" onclick="changeLanguage('de')">🇩🇪 Deutsch</button>
                </div>
                <button class="settings-btn close-modal" onclick="toggleSettings(false)">Cerrar</button>
            </div>

            <div class="screen-header">
                <div class="battery" id="batteryContainer" title="Batería">
                    <div class="battery-bar"></div>
                    <div class="battery-bar"></div>
                    <div class="battery-bar"></div>
                    <div class="battery-bar"></div>
                </div>
                <div class="device-title" id="deviceTitle">TRANSLATOR</div>
                <div class="header-right">
                    <button class="settings-btn" onclick="toggleSettings(true)">⚙ Config</button>
                </div>
            </div>

            <div class="screen-body" id="screenBodyContent"></div>
        </div>

        <div class="control-panel" id="controlPanel"></div>
    </div>

    <script>
        let currentModule = 'translator';
        let currentLang = 'en';
        let batteryDepleted = false;

        const uiTexts = {
            es: {
                modalTitle: "Seleccionar Idioma",
                translator: "TRANSLATOR",
                flashlight: "FLASHLIGHT",
                threat: "THREAT DETECTOR",
                egg: "EGG / CHARLES",
                waiting: "Esperando...",
                scannerLabel: "Escáner de Textos (Entrada):",
                scanBtn: "Escanear",
                presetsTitle: "Frases de prueba de Cobbler:",
                btnReset: "Reset",
                btnBattery: "Batería",
                lowBattery: "BATERÍA BAJA",
                shutDownMessage: "SISTEMA BLOQUEADO",
                flashlightStatus: "Linterna del Teléfono",
                notSupported: "Linterna no soportada en este navegador/PC",
                threatStatus: "Zona Segura",
                threatAlert: "¡Entidad Detectada!",
                warningTitle: "⚠️ Gira tu dispositivo",
                warningText: "Este dispositivo de Doors solo funciona en formato vertical."
            },
            en: {
                modalTitle: "Select Language",
                translator: "TRANSLATOR",
                flashlight: "FLASHLIGHT",
                threat: "THREAT DETECTOR",
                egg: "EGG / CHARLES",
                waiting: "Waiting...",
                scannerLabel: "Text Scanner (Input):",
                scanBtn: "Scan",
                presetsTitle: "Cobbler Test Phrases:",
                btnReset: "Reset",
                btnBattery: "Battery",
                lowBattery: "LOW BATTERY",
                shutDownMessage: "SYSTEM LOCKED",
                flashlightStatus: "Phone Flashlight",
                notSupported: "Flashlight not supported on this browser/PC",
                threatStatus: "Safe Zone",
                threatAlert: "Entity Detected!",
                warningTitle: "⚠️ Rotate your device",
                warningText: "This Doors device only works in portrait mode."
            },
            pt: {
                modalTitle: "Selecionar Idioma",
                translator: "TRANSLATOR",
                flashlight: "FLASHLIGHT",
                threat: "THREAT DETECTOR",
                egg: "EGG / CHARLES",
                waiting: "Aguardando...",
                scannerLabel: "Scanner de Texto:",
                scanBtn: "Escanear",
                presetsTitle: "Frases de Teste:",
                btnReset: "Reset",
                btnBattery: "Bateria",
                lowBattery: "BATERIA FRACA",
                shutDownMessage: "SISTEMA BLOQUEADO",
                flashlightStatus: "Lanterna do Telefone",
                notSupported: "Lanterna não suportada neste navegador/PC",
                threatStatus: "Zona Segura",
                threatAlert: "Entidade Detectada!",
                warningTitle: "⚠️ Vire seu dispositivo",
                warningText: "Este dispositivo do Doors funciona apenas no modo retrato."
            },
            fr: {
                modalTitle: "Sélectionner la Langue",
                translator: "TRANSLATOR",
                flashlight: "FLASHLIGHT",
                threat: "THREAT DETECTOR",
                egg: "EGG / CHARLES",
                waiting: "En attente...",
                scannerLabel: "Scanner de Texte:",
                scanBtn: "Scanner",
                presetsTitle: "Phrases Test:",
                btnReset: "Réinit",
                btnBattery: "Batterie",
                lowBattery: "BATTERIE FAIBLE",
                shutDownMessage: "SYSTÈME VERROUILLÉ",
                flashlightStatus: "Lampe du Téléphone",
                notSupported: "Lampe non supportée sur ce navigateur/PC",
                threatStatus: "Zone Sûre",
                threatAlert: "Entité Détectée!",
                warningTitle: "⚠️ Tournez votre appareil",
                warningText: "Cet appareil Doors fonctionne uniquement en mode portrait."
            },
            de: {
                modalTitle: "Sprache auswählen",
                translator: "TRANSLATOR",
                flashlight: "FLASHLIGHT",
                threat: "THREAT DETECTOR",
                egg: "EGG / CHARLES",
                waiting: "Warten...",
                scannerLabel: "Textscanner:",
                scanBtn: "Scannen",
                presetsTitle: "Testphrasen:",
                btnReset: "Zurück",
                btnBattery: "Batterie",
                lowBattery: "SCHWACHE BATTERIE",
                shutDownMessage: "SYSTEM GESPERRT",
                flashlightStatus: "Telefon-Taschenlampe",
                notSupported: "Taschenlampe wird hier nicht unterstützt",
                threatStatus: "Sichere Zone",
                threatAlert: "Bedrohung Erkannt!",
                warningTitle: "⚠️ Gerät drehen",
                warningText: "Dieses Doors-Gerät funktioniert nur im Hochformat."
            }
        };

        function detectUserLanguage() {
            const navLang = (navigator.language || navigator.userLanguage || 'en').substring(0, 2).toLowerCase();
            if (uiTexts[navLang]) currentLang = navLang;
            updateOrientationTexts();
        }

        function updateOrientationTexts() {
            const t = uiTexts[currentLang];
            const wTitle = document.getElementById('warningTitle');
            const wText = document.getElementById('warningText');
            if(wTitle && wText) { wTitle.textContent = t.warningTitle; wText.textContent = t.warningText; }
        }

        function updateLangButtonsUI() {
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.remove('selected');
                if(btn.getAttribute('onclick').includes(`'${currentLang}'`)) btn.classList.add('selected');
            });
        }

        let batteryTimer = null;
        let currentBarIndex = 3;

        function startBatteryDrain() {
            if (batteryTimer) clearInterval(batteryTimer);
            const batteryBars = document.querySelectorAll('.battery-bar');
            batteryBars.forEach(bar => bar.classList.remove('depleted'));
            currentBarIndex = batteryBars.length - 1;
            batteryDepleted = false;

            const totalDurationMs = (currentModule === 'egg') ? 268000 : 148000;
            const intervalTimeMs = totalDurationMs / batteryBars.length;

            batteryTimer = setInterval(() => {
                if (currentBarIndex >= 0) {
                    batteryBars[currentBarIndex].classList.add('depleted');
                    currentBarIndex--;
                } else {
                    clearInterval(batteryTimer);
                    batteryDepleted = true;
                    if (flashlightActive) togglePhoneFlashlight(false);
                    if (currentModule === 'egg') stopEggGame(false);
                    
                    const mainScreen = document.getElementById('mainScreen');
                    mainScreen.className = "screen dead-battery";
                    
                    const t = uiTexts[currentLang];
                    if(currentModule === 'translator') {
                        document.getElementById('statusText').textContent = t.lowBattery;
                        document.getElementById('translatedText').textContent = t.shutDownMessage;
                        document.getElementById('textScanner').disabled = true;
                        document.getElementById('scanBtn').disabled = true;
                    }
                }
            }, intervalTimeMs);
        }

        function resetBattery() {
            if(currentModule === 'egg') resetEggToMenu();
            startBatteryDrain();
            switchModule(currentModule);
        }

        function switchModule(moduleName) {
            if (currentModule === 'flashlight' && moduleName !== 'flashlight') togglePhoneFlashlight(false);
            if (currentModule === 'egg' && moduleName !== 'egg') stopEggGame(true);

            currentModule = moduleName;
            const mainScreen = document.getElementById('mainScreen');
            const deviceTitle = document.getElementById('deviceTitle');
            const screenBody = document.getElementById('screenBodyContent');
            const controlPanel = document.getElementById('controlPanel');
            const t = uiTexts[currentLang];

            document.querySelectorAll('.module-tab').forEach(tab => tab.classList.remove('active'));
            document.getElementById('tab' + moduleName.charAt(0).toUpperCase() + moduleName.slice(1)).classList.add('active');

            if (batteryDepleted) {
                mainScreen.className = "screen dead-battery";
            } else {
                mainScreen.className = `screen ${moduleName}`;
            }

            startBatteryDrain();

            if (moduleName === 'translator') {
                deviceTitle.textContent = t.translator;
                screenBody.innerHTML = `
                    <div class="speech-bubble">
                        <div id="statusText" class="status-text">${batteryDepleted ? t.lowBattery : t.waiting}</div>
                        <div id="translatedText" class="translated-text">${batteryDepleted ? t.shutDownMessage : ''}</div>
                    </div>
                `;
                controlPanel.innerHTML = `
                    <label for="textScanner">${t.scannerLabel}</label>
                    <div class="input-group">
                        <input type="text" id="textScanner" placeholder="Escribe o detecta texto..." autocomplete="off" ${batteryDepleted ? 'disabled' : ''}>
                        <button class="action-btn" id="scanBtn" ${batteryDepleted ? 'disabled' : ''}>${t.scanBtn}</button>
                    </div>
                    <div class="presets-container">
                        <div class="presets-title">${t.presetsTitle}</div>
                        <div class="preset-buttons">
                            <button class="preset-btn" onclick="setPreset('')">${t.btnReset}</button>
                            <button class="preset-btn" onclick="setPreset('cobbler name. salutation!')">Cobbler</button>
                            <button class="preset-btn" onclick="setPreset('find drink shiny water give cobbler energy, like specie.')">Agua</button>
                            <button class="preset-btn" onclick="resetBattery()">${t.btnBattery}</button>
                        </div>
                    </div>
                `;
                if (!batteryDepleted) {
                    document.getElementById('scanBtn').addEventListener('click', processTranslation);
                    document.getElementById('textScanner').addEventListener('keypress', (e) => {
                        if (e.key === 'Enter') processTranslation();
                    });
                }

            } else if (moduleName === 'flashlight') {
                deviceTitle.textContent = t.flashlight;
                screenBody.innerHTML = `
                    <div class="module-icon-container">
                        <div class="icon-box" id="flashlightIconBox">🔦</div>
                        <div class="module-subtext" id="flashlightStatusText">${t.flashlightStatus}: <span id="flashStateLabel" style="color: #ff4d4d;">OFF</span></div>
                    </div>
                `;
                controlPanel.innerHTML = `
                    <div class="presets-container">
                        <div class="presets-title">Linterna de Cámara (Móvil):</div>
                        <div class="preset-buttons">
                            <button class="preset-btn" style="background-color: #3b5a3b; font-weight: bold;" onclick="toggleFlashlightDevice()">Encender / Apagar Linterna</button>
                            <button class="preset-btn" onclick="resetBattery()">${t.btnBattery}</button>
                        </div>
                    </div>
                `;

            } else if (moduleName === 'threat') {
                deviceTitle.textContent = t.threat;
                screenBody.innerHTML = `
                    <div class="module-icon-container">
                        <div class="icon-box" id="threatIcon">⚠️</div>
                        <div class="module-subtext" id="threatStatusText">${t.threatStatus}</div>
                    </div>
                `;
                controlPanel.innerHTML = `
                    <div class="presets-container">
                        <div class="presets-title">Simulador de Amenaza:</div>
                        <div class="preset-buttons">
                            <button class="preset-btn" onclick="toggleThreatState()">Simular Alerta</button>
                            <button class="preset-btn" onclick="resetBattery()">${t.btnBattery}</button>
                        </div>
                    </div>
                `;

            } else if (moduleName === 'egg') {
                deviceTitle.textContent = "EGG";
                screenBody.innerHTML = `
                    <canvas id="eggCanvas" width="280" height="200"></canvas>
                `;
                controlPanel.innerHTML = `
                    <div class="presets-container" style="align-items: center;">
                        <div class="presets-title">Controles (Humano):</div>
                        <div class="preset-buttons" style="justify-content: center; width: 100%; display:flex; gap:5px;">
                            <button class="preset-btn" style="padding: 10px 15px;" onclick="moveHuman(-25)">◀ IZQ</button>
                            <button class="preset-btn" style="padding: 10px 15px;" onclick="moveHuman(25)">DER ▶</button>
                            <button class="preset-btn" style="background-color: #6a43a8;" onclick="resetEggToMenu()">Menú</button>
                        </div>
                    </div>
                `;
                initEggMenu();
            }
        }

        /* --- MOTOR DEL JUEGO EGG (OBJETIVO: 4 HUEVOS POR RONDA) --- */
        let eggAnimId = null;
        let bestEggScore = 0;
        let eggGameState = {
            state: 'MENU',
            score: 0,
            lives: 3,
            level: 1,
            roundEggsCollected: 0, // Cuenta los huevos recolectados en la ronda actual (meta: 4)
            humanX: 120,
            eggs: [],
            spawnTimer: 0,
            brokenEggsCount: 0
        };

        function initEggMenu() {
            eggGameState.state = 'MENU';
            eggGameState.brokenEggsCount = 0;
            if(eggAnimId) cancelAnimationFrame(eggAnimId);
            runEggLoop();
        }

        function resetEggToMenu() {
            initEggMenu();
        }

        function startEggGame() {
            eggGameState = {
                state: 'PLAYING',
                score: 0,
                lives: 3,
                level: 1,
                roundEggsCollected: 0,
                humanX: 120,
                eggs: [],
                spawnTimer: 0,
                brokenEggsCount: 0
            };
            if(eggAnimId) cancelAnimationFrame(eggAnimId);
            runEggLoop();
        }

        function stopEggGame(paused) {
            if(eggAnimId) cancelAnimationFrame(eggAnimId);
            eggGameState.state = 'PAUSED';
        }

        function moveHuman(offset) {
            if (eggGameState.state !== 'PLAYING') return;
            eggGameState.humanX += offset;
            if (eggGameState.humanX < 10) eggGameState.humanX = 10;
            if (eggGameState.humanX > 235) eggGameState.humanX = 235;
        }

        window.addEventListener('keydown', (e) => {
            if (currentModule === 'egg') {
                if (e.key === 'ArrowLeft') moveHuman(-25);
                if (e.key === 'ArrowRight') moveHuman(25);
                if (e.key === ' ' || e.key === 'Enter') {
                    if (eggGameState.state === 'MENU' || eggGameState.state === 'GAMEOVER' || eggGameState.state === 'ANTISHEAT') {
                        startEggGame();
                    }
                }
            }
        });

        document.addEventListener('click', (e) => {
            if (currentModule === 'egg') {
                const canvas = document.getElementById('eggCanvas');
                if (canvas && e.target === canvas) {
                    if (eggGameState.state === 'MENU' || eggGameState.state === 'GAMEOVER' || eggGameState.state === 'ANTISHEAT') {
                        startEggGame();
                    }
                }
            }
        });

        function registerBrokenEgg() {
            eggGameState.brokenEggsCount++;
            if (eggGameState.brokenEggsCount >= 3) {
                eggGameState.brokenEggsCount = 0;
                if (Math.random() < 0.0001) {
                    eggGameState.state = 'ANTISHEAT';
                }
            }
        }

        function runEggLoop() {
            const canvas = document.getElementById('eggCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            if (eggGameState.state === 'PLAYING') {
                eggGameState.spawnTimer++;
                let spawnRate = Math.max(40 - (eggGameState.level * 2), 20);
                if (eggGameState.spawnTimer > spawnRate) {
                    eggGameState.spawnTimer = 0;
                    let isBlue = Math.random() < 0.25;
                    eggGameState.eggs.push({
                        x: Math.random() * 240 + 20,
                        y: 0,
                        speed: 1.5 + (eggGameState.level * 0.3),
                        blue: isBlue
                    });
                }

                for (let i = eggGameState.eggs.length - 1; i >= 0; i--) {
                    let egg = eggGameState.eggs[i];
                    egg.y += egg.speed;

                    if (egg.y >= 145 && egg.y <= 175 && egg.x >= eggGameState.humanX - 5 && egg.x <= eggGameState.humanX + 30) {
                        if (egg.blue) {
                            eggGameState.lives--;
                            eggGameState.score -= 100;
                            registerBrokenEgg();
                        } else {
                            eggGameState.score += 100;
                            eggGameState.roundEggsCollected++;
                        }
                        eggGameState.eggs.splice(i, 1);

                        // Si el puntaje es negativo, Easter Egg Anticheat
                        if (eggGameState.score < 0) {
                            eggGameState.state = 'ANTISHEAT';
                            continue;
                        }

                        // Meta de ronda: al coleccionar 4 huevos normales, se avanza de nivel
                        if (eggGameState.roundEggsCollected >= 4) {
                            eggGameState.level++;
                            eggGameState.roundEggsCollected = 0; // Reinicia la cuenta para la siguiente ronda de 4
                        }
                        continue;
                    }

                    if (egg.y > 185) {
                        if (!egg.blue) {
                            eggGameState.lives--;
                            registerBrokenEgg();
                        }
                        eggGameState.eggs.splice(i, 1);
                        
                        if (eggGameState.lives <= 0) {
                            eggGameState.state = 'GAMEOVER';
                            if (eggGameState.score > bestEggScore) {
                                bestEggScore = eggGameState.score;
                            }
                        }
                    }
                }
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (eggGameState.state === 'MENU') {
                ctx.fillStyle = "#90ee90";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 38px 'Courier New'";
                ctx.textAlign = "center";
                ctx.fillText("EGG", canvas.width / 2, 75);
                ctx.strokeStyle = "#225522";
                ctx.lineWidth = 3;
                ctx.strokeText("EGG", canvas.width / 2, 75);

                if (Math.floor(Date.now() / 400) % 2 === 0) {
                    ctx.fillStyle = "#225522";
                    ctx.font = "bold 16px 'Courier New'";
                    ctx.fillText("PRESS PLAY", canvas.width / 2, 125);
                }

                ctx.fillStyle = "#ffffff";
                ctx.beginPath();
                ctx.ellipse(55, 120, 12, 16, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                ctx.beginPath();
                ctx.ellipse(225, 120, 12, 16, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = "#1a3b1a";
                ctx.font = "bold 11px 'Courier New'";
                ctx.fillText("Haz clic aquí para empezar", canvas.width / 2, 175);
                ctx.textAlign = "left";

            } else if (eggGameState.state === 'ANTISHEAT') {
                ctx.fillStyle = "#112211";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#1e4620";
                ctx.font = "bold 13px 'Courier New'";
                for (let row = 15; row < canvas.height; row += 22) {
                    ctx.fillText("CHEATER CHEATER CHEATER CHEATER", 5, row);
                }

                ctx.fillStyle = "#00ff66";
                ctx.beginPath();
                ctx.arc(canvas.width / 2, canvas.height / 2 - 10, 32, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = "#0a1a0a";
                ctx.fillRect(canvas.width / 2 - 18, canvas.height / 2 - 25, 36, 45);
                ctx.fillStyle = "#00ff66";
                ctx.fillRect(canvas.width / 2 - 10, canvas.height / 2 - 15, 6, 6);
                ctx.fillRect(canvas.width / 2 + 4, canvas.height / 2 - 15, 6, 6);

                if (Math.floor(Date.now() / 300) % 2 === 0) {
                    ctx.fillStyle = "#ff3333";
                    ctx.font = "bold 14px 'Courier New'";
                    ctx.textAlign = "center";
                    ctx.fillText("¡YUSUFINTERCEPTZ TRAMPOSO!", canvas.width / 2, canvas.height - 15);
                    ctx.textAlign = "left";
                }

            } else if (eggGameState.state === 'PLAYING') {
                ctx.fillStyle = "#87ceeb";
                ctx.fillRect(0, 0, canvas.width, 160);
                ctx.fillStyle = "#228b22";
                ctx.fillRect(0, 160, canvas.width, 40);

                ctx.fillStyle = "#000";
                ctx.font = "bold 12px 'Courier New'";
                let scoreStr = String(eggGameState.score).padStart(9, '0');
                ctx.fillText(scoreStr, 15, 20);
                // Muestra el progreso de la ronda actual (ej: 2/4 huevos)
                ctx.fillText(`ROND: ${eggGameState.roundEggsCollected}/4`, 175, 20);

                for (let h = 0; h < eggGameState.lives; h++) {
                    ctx.fillStyle = "#00ced1";
                    ctx.beginPath();
                    let hx = 25 + (h * 20);
                    let hy = 32;
                    ctx.arc(hx, hy, 5, 0, Math.PI * 2);
                    ctx.fill();
                }

                let hx = eggGameState.humanX;
                ctx.fillStyle = "#00ced1";
                ctx.fillRect(hx + 3, 155, 18, 20);
                ctx.strokeStyle = "#000";
                ctx.strokeRect(hx + 3, 155, 18, 20);

                ctx.fillStyle = "#ffffff";
                ctx.beginPath();
                ctx.arc(hx + 12, 145, 8, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = "#deb887";
                ctx.fillRect(hx + 14, 160, 15, 12);
                ctx.strokeStyle = "#000";
                ctx.strokeRect(hx + 14, 160, 15, 12);

                for (let egg of eggGameState.eggs) {
                    ctx.fillStyle = egg.blue ? "#1e90ff" : "#ffffff";
                    ctx.beginPath();
                    ctx.ellipse(egg.x, egg.y, 8, 11, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = "#000";
                    ctx.stroke();
                }

            } else if (eggGameState.state === 'GAMEOVER') {
                ctx.fillStyle = "#90ee90";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#225522";
                ctx.font = "bold 12px 'Courier New'";
                ctx.textAlign = "center";
                ctx.fillText("YOUR SCORE", canvas.width / 2, 55);

                ctx.fillStyle = "#004d00";
                ctx.font = "bold 18px 'Courier New'";
                let finalScoreStr = String(eggGameState.score).padStart(9, '0');
                ctx.fillText(finalScoreStr, canvas.width / 2, 85);

                ctx.fillStyle = "#004d00";
                ctx.font = "bold 15px 'Courier New'";
                let bestScoreStr = String(bestEggScore).padStart(9, '0');
                ctx.fillText(`LAM: ${bestScoreStr}`, canvas.width / 2, 125);

                if (Math.floor(Date.now() / 400) % 2 === 0) {
                    ctx.fillStyle = "#ffcc00";
                    ctx.font = "bold 13px 'Courier New'";
                    ctx.fillText("> PLAY AGAIN <", canvas.width / 2, 165);
                }
                ctx.textAlign = "left";
            }

            eggAnimId = requestAnimationFrame(runEggLoop);
        }

        let mediaStream = null;
        let trackCapabilities = null;
        let flashlightActive = false;

        async function toggleFlashlightDevice() {
            if (batteryDepleted) return;
            const t = uiTexts[currentLang];
            const stateLabel = document.getElementById('flashStateLabel');
            const iconBox = document.getElementById('flashlightIconBox');

            if (!flashlightActive) {
                try {
                    mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                    const track = mediaStream.getVideoTracks()[0];
                    trackCapabilities = track.getCapabilities();
                    if (!trackCapabilities.torch) { alert(t.notSupported); stopMediaStream(); return; }
                    await track.applyConstraints({ advanced: [{ torch: true }] });
                    flashlightActive = true;
                    if (stateLabel) { stateLabel.textContent = "ON"; stateLabel.style.color = "#4dff4d"; }
                    if (iconBox) iconBox.style.borderColor = "#4dff4d";
                } catch (err) { alert(t.notSupported); }
            } else { togglePhoneFlashlight(false); }
        }

        function togglePhoneFlashlight(turnOff) {
            if (turnOff || flashlightActive) {
                if (mediaStream) {
                    const track = mediaStream.getVideoTracks()[0];
                    if (track && trackCapabilities && trackCapabilities.torch) {
                        track.applyConstraints({ advanced: [{ torch: false }] }).catch(() => {});
                    }
                    stopMediaStream();
                }
                flashlightActive = false;
                const stateLabel = document.getElementById('flashStateLabel');
                const iconBox = document.getElementById('flashlightIconBox');
                if (stateLabel) {
                    stateLabel.textContent = "OFF";
                    stateLabel.style.color = "#ff4d4d";
                }
                if (iconBox) iconBox.style.borderColor = "currentColor";
            }
        }

        function stopMediaStream() {
            if (mediaStream) { mediaStream.getTracks().forEach(track => track.stop()); mediaStream = null; }
        }

        let threatActive = false;
        function toggleThreatState() {
            if (batteryDepleted) return;
            threatActive = !threatActive;
            const status = document.getElementById('threatStatusText');
            const icon = document.getElementById('threatIcon');
            const t = uiTexts[currentLang];
            if(threatActive) {
                status.textContent = t.threatAlert; status.style.color = "#ff4d4d"; icon.style.borderColor = "#ff4d4d";
            } else {
                status.textContent = t.threatStatus; status.style.color = "#fff"; icon.style.borderColor = "currentColor";
            }
        }

        function processTranslation() {
            if (batteryDepleted) return;
            const textScanner = document.getElementById('textScanner');
            if(!textScanner) return;
            const rawText = textScanner.value.trim();
            const statusText = document.getElementById('statusText');
            const translatedText = document.getElementById('translatedText');
            const t = uiTexts[currentLang];

            if (rawText === "") {
                statusText.textContent = t.waiting; translatedText.textContent = ""; statusText.style.color = "#d1bcef";
            } else {
                statusText.textContent = "COBBLER"; statusText.style.color = "#ffb347"; translatedText.textContent = `"${rawText}"`;
            }
        }

        function setPreset(text) {
            if (batteryDepleted) return;
            const textScanner = document.getElementById('textScanner');
            if(textScanner) { textScanner.value = text; processTranslation(); }
        }

        function toggleSettings(show) {
            const modal = document.getElementById('settingsModal');
            if (show) modal.classList.add('active'); else modal.classList.remove('active');
        }

        function changeLanguage(lang) {
            currentLang = lang;
            updateLangButtonsUI();
            document.getElementById('modalTitle').textContent = uiTexts[currentLang].modalTitle;
            updateOrientationTexts();
            switchModule(currentModule);
            toggleSettings(false);
        }

        detectUserLanguage();
        updateLangButtonsUI();
        switchModule('translator');
    </script>
</body>
</html>
